@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&display=swap');

.pdx-root, .pdx-root * { box-sizing: border-box; margin: 0; padding: 0; }
.pdx-root {
  width: 100%; height: 100vh; min-height: 640px;
  background: ${S.cream}; color: ${S.ink};
  font-family: ${S.serif};
  display: flex; flex-direction: column;
  overflow: hidden; position: relative;
}
.pdx-root ::selection { background: ${S.oxblood}; color: ${S.cream}; }

/* top chrome */
.pdx-top {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 18px 34px 14px; border-bottom: 1px solid ${S.line};
  flex: 0 0 auto;
}
.pdx-wordmark { font-family: ${S.mono}; font-size: 13px; letter-spacing: 0.08em; color: ${S.ink}; }
.pdx-wordmark b { color: ${S.oxblood}; font-weight: 600; }
.pdx-lessontag { font-family: ${S.mono}; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: ${S.inkSoft}; }

/* stage */
.pdx-stage {
  flex: 1 1 auto; overflow: hidden; position: relative;
  display: flex; flex-direction: column;
}
.pdx-slide {
  flex: 1 1 auto; overflow-y: auto;
  padding: 40px 72px 56px;
  animation: pdxIn 320ms ease both;
}
@keyframes pdxIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* kicker + title */
.pdx-kicker {
  font-family: ${S.mono}; font-size: 12px; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase; color: ${S.oxblood};
  margin-bottom: 14px;
}
.pdx-kicker .no { color: ${S.inkSoft}; margin-right: 14px; }
.pdx-title {
  font-family: ${S.serif}; font-weight: 500; font-size: clamp(28px, 3.6vw, 46px);
  line-height: 1.08; letter-spacing: -0.01em; max-width: 21em; margin-bottom: 10px;
}
.pdx-sub {
  font-family: ${S.serif}; font-style: italic; font-weight: 300;
  font-size: clamp(16px, 1.6vw, 21px); color: ${S.inkSoft};
  max-width: 42em; margin-bottom: 6px;
}
.pdx-rule { height: 1px; background: ${S.line}; margin: 26px 0; border: 0; }

/* generic body text */
.pdx-body { font-size: clamp(15px, 1.35vw, 19px); line-height: 1.55; font-weight: 400; }
.pdx-body em { font-style: italic; }
.pdx-mono-label {
  font-family: ${S.mono}; font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase; color: ${S.oxblood};
  display: block; margin-bottom: 8px;
}

/* columns */
.pdx-cols { display: grid; gap: 34px; margin-top: 30px; }
.pdx-cols.c2 { grid-template-columns: 1fr 1fr; }
.pdx-cols.c3 { grid-template-columns: 1fr 1fr 1fr; }
.pdx-cols.c4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) {
  .pdx-slide { padding: 28px 26px 48px; }
  .pdx-cols.c2, .pdx-cols.c3, .pdx-cols.c4 { grid-template-columns: 1fr; gap: 20px; }
}

/* card */
.pdx-card {
  border: 1px solid ${S.line}; padding: 20px 22px; background: rgba(255,255,255,0.28);
}
.pdx-card.tint { background: ${S.creamDeep}; }
.pdx-card.ox { background: ${S.oxblood}; color: ${S.cream}; border-color: ${S.oxblood}; }
.pdx-card.ox .pdx-mono-label { color: ${S.cream}; opacity: 0.85; }
.pdx-card h4 {
  font-family: ${S.serif}; font-weight: 500; font-size: clamp(17px, 1.6vw, 22px);
  margin-bottom: 8px; line-height: 1.2;
}
.pdx-card p { font-size: clamp(14px, 1.2vw, 16.5px); line-height: 1.5; color: inherit; }
.pdx-card p + p { margin-top: 8px; }

/* numbered list rows */
.pdx-numrow {
  display: grid; grid-template-columns: 64px 1fr; gap: 18px;
  padding: 14px 0; border-bottom: 1px solid ${S.lineSoft};
  align-items: baseline;
}
.pdx-numrow:last-child { border-bottom: 0; }
.pdx-numrow .n {
  font-family: ${S.mono}; font-size: clamp(15px, 1.5vw, 19px); font-weight: 600; color: ${S.oxblood};
}
.pdx-numrow .h { font-family: ${S.serif}; font-weight: 500; font-size: clamp(16px, 1.5vw, 20px); }
.pdx-numrow .d { font-size: clamp(14px, 1.2vw, 16.5px); color: ${S.inkSoft}; line-height: 1.5; margin-top: 3px; }

/* takeaway band */
.pdx-band {
  margin-top: 30px; padding: 16px 22px;
  background: ${S.oxblood}; color: ${S.cream};
  font-family: ${S.serif}; font-style: italic; font-weight: 400;
  font-size: clamp(15px, 1.5vw, 20px); line-height: 1.45;
}
.pdx-band b { font-style: normal; font-weight: 600; }

/* formula slide */
.pdx-formula {
  font-family: ${S.mono}; font-size: clamp(16px, 2vw, 26px); line-height: 1.9;
  margin-top: 26px; padding: 26px 30px; border: 1px solid ${S.line};
  background: rgba(255,255,255,0.3);
}
.pdx-formula .slot { color: ${S.oxblood}; font-weight: 600; }
.pdx-example {
  margin-top: 22px; font-family: ${S.serif}; font-style: italic; font-weight: 400;
  font-size: clamp(17px, 1.9vw, 25px); line-height: 1.5; color: ${S.ink};
  border-left: 3px solid ${S.oxblood}; padding-left: 22px; max-width: 34em;
}

/* acts */
.pdx-act { position: relative; padding-top: 14px; }
.pdx-act::before {
  content: ""; display: block; height: 3px; background: ${S.oxblood};
  margin-bottom: 16px; width: 48px;
}
.pdx-act .actno {
  font-family: ${S.mono}; font-size: 12px; letter-spacing: 0.22em;
  text-transform: uppercase; color: ${S.oxblood}; font-weight: 600;
  display: block; margin-bottom: 6px;
}
.pdx-act h3 { font-family: ${S.serif}; font-weight: 500; font-size: clamp(19px, 2vw, 27px); margin-bottom: 8px; }
.pdx-act p { font-size: clamp(14px, 1.25vw, 17px); line-height: 1.5; color: ${S.inkSoft}; }

/* mistakes grid */
.pdx-mistake { border-top: 2px solid ${S.oxblood}; padding-top: 12px; }
.pdx-mistake .mn { font-family: ${S.mono}; font-size: 12px; color: ${S.oxblood}; font-weight: 600; }
.pdx-mistake h4 { font-family: ${S.serif}; font-weight: 500; font-size: clamp(15px, 1.4vw, 19px); margin: 4px 0 4px; }
.pdx-mistake p { font-size: clamp(13px, 1.1vw, 15px); color: ${S.inkSoft}; line-height: 1.45; }

/* checklist */
.pdx-check { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid ${S.lineSoft}; align-items: baseline; }
.pdx-check:last-child { border-bottom: 0; }
.pdx-check .bx {
  width: 15px; height: 15px; border: 1.5px solid ${S.oxblood}; display: inline-block;
  transform: translateY(2px);
}
.pdx-check .tx { font-size: clamp(15px, 1.4vw, 19px); line-height: 1.5; }

/* closing */
.pdx-closing { display: flex; flex-direction: column; justify-content: center; height: 100%; }
.pdx-closing .big {
  font-family: ${S.serif}; font-weight: 400; font-size: clamp(30px, 4.4vw, 58px);
  line-height: 1.15; max-width: 17em; letter-spacing: -0.01em;
}
.pdx-closing .big b { font-weight: 600; color: ${S.oxblood}; font-style: italic; }
.pdx-closing .trio {
  margin-top: 44px; display: flex; gap: 18px; flex-wrap: wrap;
  font-family: ${S.mono}; font-size: clamp(12px, 1.2vw, 15px);
  letter-spacing: 0.14em; text-transform: uppercase; color: ${S.oxblood};
}
.pdx-closing .trio span { border: 1px solid ${S.oxblood}; padding: 10px 16px; }

/* cover */
.pdx-cover { display: flex; flex-direction: column; justify-content: center; height: 100%; }
.pdx-cover .over {
  font-family: ${S.mono}; font-size: clamp(12px, 1.2vw, 14px); letter-spacing: 0.26em;
  text-transform: uppercase; color: ${S.oxblood}; font-weight: 600; margin-bottom: 26px;
}
.pdx-cover h1 {
  font-family: ${S.serif}; font-weight: 500; font-size: clamp(44px, 7vw, 92px);
  line-height: 0.98; letter-spacing: -0.02em; max-width: 10em;
}
.pdx-cover .cover-sub {
  margin-top: 26px; font-family: ${S.serif}; font-style: italic; font-weight: 300;
  font-size: clamp(18px, 2.2vw, 28px); color: ${S.inkSoft};
}
.pdx-cover .formats {
  margin-top: 40px; font-family: ${S.mono}; font-size: clamp(12px, 1.2vw, 15px);
  letter-spacing: 0.12em; text-transform: uppercase; color: ${S.ink};
}
.pdx-cover .formats i { font-style: normal; color: ${S.oxblood}; margin: 0 10px; }
.pdx-cover .byline {
  margin-top: 14px; font-family: ${S.mono}; font-size: 13px; color: ${S.inkSoft}; letter-spacing: 0.06em;
}

/* bottom chrome */
.pdx-bottom {
  flex: 0 0 auto; display: flex; align-items: center; gap: 18px;
  padding: 12px 34px 16px; border-top: 1px solid ${S.line};
  font-family: ${S.mono}; font-size: 12px; color: ${S.inkSoft};
}
.pdx-progress { flex: 1 1 auto; height: 2px; background: ${S.lineSoft}; position: relative; }
.pdx-progress .fill { position: absolute; inset: 0 auto 0 0; background: ${S.oxblood}; transition: width 260ms ease; }
.pdx-btn {
  font-family: ${S.mono}; font-size: 12px; letter-spacing: 0.08em;
  background: none; border: 1px solid ${S.line}; color: ${S.ink};
  padding: 6px 12px; cursor: pointer; transition: all 140ms ease;
}
.pdx-btn:hover { border-color: ${S.oxblood}; color: ${S.oxblood}; }
.pdx-btn.active { background: ${S.oxblood}; border-color: ${S.oxblood}; color: ${S.cream}; }
.pdx-count { min-width: 74px; text-align: center; letter-spacing: 0.1em; }

/* notes drawer */
.pdx-notes {
  position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 88vw);
  background: ${S.ink}; color: ${S.cream}; padding: 30px 28px;
  overflow-y: auto; z-index: 30;
  box-shadow: -12px 0 34px rgba(43,33,27,0.35);
  animation: pdxNotes 240ms ease both;
}
@keyframes pdxNotes { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.pdx-notes .nt { font-family: ${S.mono}; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: ${S.cream}; opacity: 0.6; margin-bottom: 18px; }
.pdx-notes p { font-family: ${S.serif}; font-size: 16.5px; line-height: 1.6; font-weight: 300; margin-bottom: 14px; }
.pdx-notes p::before { content: "\u2014 "; color: ${S.oxblood}; font-weight: 600; }

/* grid overview */
.pdx-grid {
  position: absolute; inset: 0; z-index: 40; background: ${S.cream};
  padding: 34px; overflow-y: auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px;
  align-content: start;
  animation: pdxIn 220ms ease both;
}
.pdx-thumb {
  border: 1px solid ${S.line}; background: rgba(255,255,255,0.35);
  padding: 14px 16px; cursor: pointer; min-height: 108px;
  display: flex; flex-direction: column; gap: 8px; transition: all 140ms ease;
  text-align: left;
}
.pdx-thumb:hover { border-color: ${S.oxblood}; transform: translateY(-2px); }
.pdx-thumb.cur { background: ${S.oxblood}; color: ${S.cream}; border-color: ${S.oxblood}; }
.pdx-thumb .tn { font-family: ${S.mono}; font-size: 11px; color: ${S.oxblood}; font-weight: 600; }
.pdx-thumb.cur .tn { color: ${S.cream}; }
.pdx-thumb .tt { font-family: ${S.serif}; font-weight: 500; font-size: 14.5px; line-height: 1.25; }

/* nav arrows */
.pdx-arrows { display: flex; gap: 8px; }
